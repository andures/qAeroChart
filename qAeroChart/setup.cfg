[flake8]
max-line-length = 119
exclude =
    .git,
    __pycache__,
    .venv,
    tests

per-file-ignores =
    # Compact aeronautical math scripts — intentional dense formatting and star imports.
    # Leading bare '*' (not a fixed 'qAeroChart/' prefix) so this matches regardless of
    # whether flake8 is invoked from the repo root or with cwd inside the plugin folder
    # (as the QGIS store scanner does) — see qgis-plugin-store-compliance skill, Gotcha 2.
    # Unblocked by: full script refactor (no planned date)
    *scripts/*.py: F401,F403,F405,E111,E128,E129,E201,E202,E203,E211,E221,E225,E231,E402,E501,E702,F541,F841,W291
    # Generated/legacy UI files — no active maintenance
    # Unblocked by: UI regeneration from .ui files
    *ui/profile_creation_dialog_gen.py: F401,E501
    *ui/profile_creation_dialog_ui.py: F401,E501
    *qaerochart_dockwidget_base.py: E128
